name: Deploy dashboard to GitHub Pages

# The dashboard is built locally (`invoke run-dashboard`) and committed under
# output_data/, because building it needs the datalad source data. CI only
# publishes the committed files.
on:
  push:
    branches: [main]
    paths:
      - output_data/release_dashboard.html
      - output_data/release_dashboard_data/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble site
        run: |
          mkdir _site
          cp output_data/release_dashboard.html _site/index.html
          cp -r output_data/release_dashboard_data _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
